name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/agent-afterlife.js validate test/fixtures/minimal.json
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The action builds a site from a data file
        uses: ./
        with:
          source: examples/events.csv
          merit: "commit + pr_merged*5"
          title: "Action test"
          out: site-file
      - name: The action builds a site from this repository's pull requests
        uses: ./
        with:
          source: github
          options: |
            max=20
          out: site-github
      - name: Both sites have their data and pages
        run: |
          for d in site-file site-github; do
            test -f $d/data.json && test -f $d/temple/index.html && test -f $d/graveyard/index.html
            grep -q 'name="afterlife-data" content="data.json"' $d/temple/index.html
            node bin/agent-afterlife.js validate $d/data.json
          done
  quickstart:
    # The README's commands as written, through npx from GitHub, on the oldest and a current Node.
    # Pull requests from forks are skipped: npx cannot fetch a fork's branch from this repository.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bash test/quickstart.sh "github:alexgaoth/agent-afterlife#${{ github.head_ref || github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

