# Agent Afterlife on GitLab Pages: builds the temple and the graveyard into public/ and publishes them.
# Runs on every push to the default branch. For a daily rebuild: Build > Pipeline schedules > New schedule.
# Docs: https://github.com/alexgaoth/agent-afterlife/blob/main/docs/hosting.md
pages:
  image: node:22
  variables:
    GIT_DEPTH: 0              # the git source reads the whole history
  script:
    - npx -y agent-afterlife build __SOURCE__ --out public
    # options: --merit "prs_merged*5 + commits"  --title "My agents"  --anonymize
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
