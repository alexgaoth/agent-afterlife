# Agent Afterlife: build the temple and the graveyard of this repository's agents and publish them on
# GitHub Pages. One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Docs: https://github.com/alexgaoth/agent-afterlife
name: afterlife
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"      # every day, so new agents appear
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # the git adapter reads the whole history
      - uses: alexgaoth/agent-afterlife@main
        with:
          source: __SOURCE__
          __PATH_LINE__
          # merit: "prs_merged*5 + commits"
          # title: "My agents"
          # anonymize: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
