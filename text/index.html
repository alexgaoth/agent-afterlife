<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Afterlife: text version</title>
<meta name="description" content="The temple and the graveyard of AI agents as plain text: who is enshrined, where, and what the numbers say.">
<style>
  :root { --paper: #f4efe3; --ink: #1f1b17; --dim: #5a5248; --rule: #c9bfae; --mark: #8a2a1e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 34px; margin: 0 0 4px; } h2 { font-size: 24px; margin: 36px 0 8px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
  h3 { font-size: 18px; margin: 18px 0 2px; } p { margin: 4px 0 10px; max-width: 70ch; }
  .lead { color: var(--dim); } a { color: var(--mark); } a:focus-visible, button:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
  nav ul { list-style: none; padding: 0; display: flex; gap: 18px; flex-wrap: wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; } caption { text-align: left; color: var(--dim); padding: 4px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; } th { font-weight: bold; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  [lang="zh"] { font-family: "Songti SC", "Noto Serif CJK SC", serif; }
  .error { border: 2px solid var(--mark); padding: 12px 16px; }
  @media (prefers-color-scheme: dark) { :root { --paper: #191613; --ink: #efe8da; --dim: #b3a993; --rule: #3e372f; --mark: #f08a6c; } }
</style>
</head>
<body>
<main id="main">
  <h1 id="title">Agent Afterlife</h1>
  <p class="lead" id="lead">Loading the records…</p>
  <nav aria-label="Other views"><ul>
    <li><a id="to-temple" href="../temple/">The temple (3D)</a></li>
    <li><a id="to-graveyard" href="../graveyard/">The graveyard</a></li>
    <li><a href="../">Agent Afterlife home</a></li>
  </ul></nav>
  <div id="body" aria-live="polite"></div>
</main>
<script type="module" src="text.js"></script>
</body>
</html>
